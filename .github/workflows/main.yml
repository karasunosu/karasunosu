name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT }}
          user: karasunosu

          base: header, activity, repositories

          plugin_activity: yes
          plugin_languages: yes
          plugin_isocalendar: yes
